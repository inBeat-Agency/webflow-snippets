  Preload de las 2 fuentes custom del sitio (Soehne Buch + Soehne Kraftig)
  para evitar que el browser las descubra recien despues de parsear el CSS.

  PROBLEMA QUE RESUELVE:
    Sin preload, el orden de eventos en cold load es:
      1. HTML llega
      2. Browser parsea CSS (bloquea render)
      3. CSS dice "necesito Soehne Buch via @font-face"
      4. Browser INICIA descarga de la fuente (tarde)
      5. Con font-display: swap, el H1 se pinta con fallback mientras tanto
      6. Cuando llega la fuente, swap → repaint
    El LCP (sobre todo cuando el LCP es texto con fuente custom, como el H1
    de los blog posts) queda colgando hasta el paso 4-5.

  Con preload, el orden es:
      1. HTML llega
      2. Browser ve <link rel="preload" as="font"> en <head> y arranca
         descarga EN PARALELO con el CSS parse
      3. Para cuando el CSS pide la fuente, ya esta descargada o casi
      4. El H1 se pinta directo con la fuente correcta
    LCP -500ms a -2s en cold loads, sin FOUT visible.

  REQUISITOS PARA QUE FUNCIONE:
    - crossorigin OBLIGATORIO. Sin esto, el browser descarga 2 veces
      (una para el preload, otra para el @font-face) y el preload no sirve.
    - URLs EXACTAS a las del @font-face. Las URLs estan hardcodeadas porque
      Webflow las hostea con hash inmutable en su CDN (cache-control: 1 anio,
      last-modified estable desde 2024). Si Webflow llegara a cambiarlas
      (improbable), Lighthouse va a warnear "preload not used" y hay que
      actualizar el snippet.
    - type="font/woff2" aunque el server devuelva application/octet-stream.
      El browser confia en el type del link, no del response.
    - DEBE estar en SITE SETTINGS Head Code, no en page-level ni en footer.
      Cuanto mas arriba del <head>, mas temprano arranca la descarga.

  AUDITS QUE PUEDE TOCAR:
    - "Preload key requests" del Lighthouse: el preload mismo cumple esta
      recomendacion.
    - "Eliminate render-blocking resources": no es un fix directo pero
      reduce el waterfall.

  COMO VERIFICAR DESPUES DE PUBLICAR:
    1. DevTools → Network → recargar con cache deshabilitado
    2. Ver que las dos .woff2 arrancan a descargar en los primeros ~50ms
       (antes que el CSS termine de parsear)
    3. NO debe aparecer warning "preload not used within a few seconds"
       en la consola
    4. Comparar score Lighthouse mobile antes vs despues
-->

      crossorigin>
